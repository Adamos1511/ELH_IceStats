name: ELH Match Center

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt the running match session when the next schedule is queued.
concurrency:
  group: elh-match-center
  cancel-in-progress: false

jobs:
  update-matches:
    # Standard runners are free for PUBLIC repos. Do not silently consume private minutes.
    if: github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data dependencies
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' tzdata
      - name: Publish Match Center data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ELH_SEASON: '2026'
          ELH_COMPETITION: '7562'
          PYTHONUNBUFFERED: '1'
        run: python -m data_bot.modules.match_worker --session --max-seconds 12600
